[package]
name         = "agent"
version      = "0.3.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/agent"
description  = "LLM-API-call daemon: makes OpenAI-compatible provider HTTP calls."

[lib]
name = "agent"
path = "src/lib.rs"

[[bin]]
name = "agent"
path = "src/bin/agent.rs"

[[bin]]
name = "agent-daemon"
path = "src/bin/agent_daemon.rs"

[[bin]]
name = "agent-write-configuration"
path = "src/bin/agent_write_configuration.rs"

[features]
default = ["dotos-text"]
# dotos-text enables the DOTOS text codec on the canonical signal contracts and
# the CLI's text edge.
dotos-text = ["signal-agent/dotos-text", "meta-signal-agent/dotos-text"]
# `live-provider` turns on the reqwest-backed OpenAI-compatible provider. Off by
# default so the crate (and its fixture round-trip test) builds with no network
# stack. Real-network tests gate on an API key being present at runtime.
live-provider = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[dependencies]
dotos = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "80c7b17f7ad3cf547d2624c6a243e5de5f85c9f3" }
rkyv             = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame     = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "8aa0bcaeb29fe9e461a11706a469638d2fd109ac" }
signal-agent      = { git = "https://github.com/LiGoldragon/signal-agent.git", rev = "d9ca91d7c2e6f6d3c52957c559bb41292fb21a8e" }
meta-signal-agent = { git = "https://github.com/LiGoldragon/meta-signal-agent.git", rev = "5104d4569beade7de15d7683f8e383753ceb77ff" }
thiserror        = "2"
tokio            = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
triad-runtime    = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "e44c07dbf31497af95eb461826bb9502115fbcfe" }

reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde        = { version = "1", features = ["derive"], optional = true }
serde_json   = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"
