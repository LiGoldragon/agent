[package]
name         = "agent"
version      = "0.2.0"
edition      = "2024"
rust-version = "1.89"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/LiGoldragon/agent"
description  = "LLM-API-call daemon: makes OpenAI-compatible provider HTTP calls."

[lib]
name = "agent"
path = "src/lib.rs"

[[bin]]
name = "agent"
path = "src/bin/agent.rs"

[[bin]]
name = "agent-daemon"
path = "src/bin/agent_daemon.rs"

[[bin]]
name = "agent-write-configuration"
path = "src/bin/agent_write_configuration.rs"

[features]
default = ["dotos-text"]
# dotos-text enables the DOTOS text codec on the generated runtime nouns and the
# CLI's text edge. The generated schema modules gate their DOTOS surface on it.
dotos-text = ["signal-agent/dotos-text", "meta-signal-agent/dotos-text"]
# `live-provider` turns on the reqwest-backed OpenAI-compatible provider. Off by
# default so the crate (and its fixture round-trip test) builds with no network
# stack. Real-network tests gate on an API key being present at runtime.
live-provider = ["dep:reqwest", "dep:serde", "dep:serde_json"]

[dependencies]
dotos = { package = "dotos", git = "https://github.com/LiGoldragon/dotos.git", rev = "80c7b17f7ad3" }
rkyv             = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
signal-frame     = { git = "https://github.com/LiGoldragon/signal-frame.git", rev = "ca72b2d1151f" }
signal-agent      = { git = "https://github.com/LiGoldragon/signal-agent.git", rev = "c7255b7a402f1777acb218073a6c4b53064ea5eb" }
meta-signal-agent = { git = "https://github.com/LiGoldragon/meta-signal-agent.git", rev = "cbae1c70d01eae5fe531aad4dedcbfdf7099075f" }
thiserror        = "2"
tokio            = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "time"] }
triad-runtime    = { git = "https://github.com/LiGoldragon/triad-runtime.git", rev = "e44c07dbf31497af95eb461826bb9502115fbcfe" }

reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde        = { version = "1", features = ["derive"], optional = true }
serde_json   = { version = "1", optional = true }

[build-dependencies]
schema-rust = { package = "schema-rust", git = "https://github.com/LiGoldragon/schema-rust.git", rev = "6179a7cf1394083244dd3f3e1d2709f9ec08f7db" }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused      = { level = "warn", priority = -1 }
dead_code   = "warn"

[patch.crates-io]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main" }
